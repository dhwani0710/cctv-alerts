<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employees — VaultWatch</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="shell">
    <nav class="rail">
      <div class="rail-brand stamp" data-stamp></div>

      <a class="rail-link" data-page="dashboard" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1" />
        </svg>
        <span class="tip">Dashboard</span>
      </a>
      <a class="rail-link active" data-page="employees" href="admin-employees.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="8" r="3" />
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
          <circle cx="17" cy="8" r="2.4" />
          <path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8" />
        </svg>
        <span class="tip">Employees</span>
      </a>
      <a class="rail-link" data-page="cameras" href="cameras-alerts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="7" width="14" height="11" rx="2" />
          <path d="M16.5 10.5 21 8v9l-4.5-2.5" />
        </svg>
        <span class="tip">Cameras & Alerts</span>
      </a>
      <a class="rail-link" data-page="attendance" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2" />
          <path d="M3.5 9.5h17" />
          <path d="M8 3v3M16 3v3" />
          <path d="m8.5 14 2 2 4-4" />
        </svg>
        <span class="tip">Attendance</span>
      </a>
      <a class="rail-link" data-page="records" href="records.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M8 8h8M8 12h8M8 16h5" />
        </svg>
        <span class="tip">Records</span>
      </a>
      <div class="rail-spacer"></div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Employees</div>
        <div class="topbar-right">
          <span class="topbar-clock mono" data-clock></span>
          <button class="theme-toggle" data-theme-toggle title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <span class="role-badge" data-role-badge></span>
          <div class="user-chip">
            <div class="avatar" data-user-avatar></div>
            <span class="name" data-user-name></span>
          </div>
          <button class="logout-btn" data-logout>Sign out</button>
        </div>
      </header>

      <main class="content dark">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between;">
          <div>
            <span class="eyebrow">Admin only</span>
            <h1>Staff roster</h1>
            <p>Add staff, set shift hours, and manage store access. Employees are grouped by designation — changing
              someone's designation moves them into the matching column.</p>
          </div>
          <button class="btn btn-brass" id="addToggle">+ Add employee</button>
        </div>

        <div class="panel" id="addPanel" style="display:none; margin-bottom:22px;">
          <div class="panel-head">
            <h2>New employee</h2>
          </div>
          <form id="addForm" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
            <div class="field"><label>Full name</label><input type="text" required /></div>
            <div class="field">
              <label>Designation</label>
              <input type="text" id="newRoleInput" list="roleOptions" placeholder="Sales Associate" required />
              <datalist id="roleOptions"></datalist>
            </div>
            <div class="field"><label>Shift start</label><input type="time" required /></div>
            <div class="field"><label>Shift end</label><input type="time" required /></div>
            <div class="field" style="grid-column:1/-1;"><label>Photo (for face
                match)</label><input type="file" accept="image/*" />
        </div>
        <div style="grid-column:1/-1; display:flex; gap:10px;">
          <button type="submit" class="btn btn-brass">Save employee</button>
          <button type="button" class="btn btn-outline" id="cancelAdd">Cancel</button>
        </div>
        </form>
    </div>

    <div class="search-bar" id="searchBar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search employees by name…" autocomplete="off" />
      <button type="button" class="search-clear" id="searchClear" title="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="role-board" id="roleBoard"></div>

    <div class="cam-lightbox" id="deleteConfirmModal">
      <div class="login-card"
        style="background:var(--ink-2); border:1px solid var(--ink-line); border-radius:var(--radius-lg); padding:24px; max-width:360px;">
        <h2 style="margin-top:0;">Remove employee</h2>
        <p class="sub" id="deleteConfirmText"></p>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button class="btn btn-outline" id="deleteCancelBtn">Cancel</button>
          <button class="btn btn-danger" id="deleteConfirmBtn">Remove</button>
        </div>
      </div>
    </div>
    </main>
  </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireAuth(['admin']);
    let staffData = [];

    if (session) {
      initShell(session, 'employees');
      initTheme();

      const roleBoard = document.getElementById('roleBoard');
      const roleOptions = document.getElementById('roleOptions');
      const searchBar = document.getElementById('searchBar');
      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');

      let editingIndex = null;
      let pendingDeleteIndex = null;
      const openRoles = new Set();
      let searchTerm = '';

      document.getElementById('deleteCancelBtn').addEventListener('click', () => {
        pendingDeleteIndex = null;
        document.getElementById('deleteConfirmModal').classList.remove('open');
      });

      document.getElementById('deleteConfirmBtn').addEventListener('click', async () => {
        if (pendingDeleteIndex === null) return;
        await fetch(`${API_BASE}/employees/${staffData[pendingDeleteIndex].id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${session.token}` }
        });
        pendingDeleteIndex = null;
        editingIndex = null;
        document.getElementById('deleteConfirmModal').classList.remove('open');
        loadStaff();
      });

      async function loadStaff() {
        const res = await fetch(`${API_BASE}/employees`, {
          headers: { "Authorization": `Bearer ${session.token}` }
        });
        const employees = await res.json();
        staffData = employees.map(e => ({
          id: e.id,
          name: e.name,
          role: e.designation || "Staff",
          shift: `${e.shift_start} – ${e.shift_end}`,
          shift_start: e.shift_start,
          shift_end: e.shift_end
        }));
        renderBoard();
      }

      function getDesignations() {
        const seen = [];
        staffData.forEach((s) => {
          if (!seen.includes(s.role)) seen.push(s.role);
        });
        return seen;
      }

      function makeStaffCard(s, index) {
        const card = document.createElement('div');
        card.className = 'staff-card';
        const isEditing = editingIndex === index;

        card.innerHTML = `
      <div class="avatar">${initials(s.name)}</div>
      <div class="name">${s.name}</div>
      <div class="role">${s.role}</div>
      <div class="row"><span>Shift</span><span>${s.shift}</span></div>
      ${isEditing ? `
        <div class="role-edit-row">
          <select class="roleSelect">
            ${getDesignations().map(r => `<option value="${r}" ${r === s.role ? 'selected' : ''}>${r}</option>`).join('')}
            <option value="__new__">+ New designation…</option>
          </select>
        </div>
        <div class="role-edit-row newRoleRow" style="display:none;">
          <input type="text" class="newRoleInput" placeholder="Type new designation" />
        </div>
        <div class="actions">
          <button class="btn btn-brass btn-sm saveRoleBtn">Save</button>
          <button class="btn btn-outline btn-sm cancelRoleBtn">Cancel</button>
        </div>
      ` : `
        <div class="actions">
          <button class="btn btn-outline btn-sm editBtn">Edit</button>
          <button class="btn btn-danger btn-sm removeBtn">Remove</button>
        </div>
      `}
    `;

        if (isEditing) {
          const select = card.querySelector('.roleSelect');
          const newRoleRow = card.querySelector('.newRoleRow');
          const newRoleInput = card.querySelector('.newRoleInput');

          select.addEventListener('change', () => {
            newRoleRow.style.display = select.value === '__new__' ? 'flex' : 'none';
          });

          card.querySelector('.saveRoleBtn').addEventListener('click', async (e) => {
            e.stopPropagation();
            let newRole = select.value;
            if (newRole === '__new__') {
              newRole = newRoleInput.value.trim();
              if (!newRole) return;
            }
            const emp = staffData[index];
            const formData = new FormData();
            formData.append("name", emp.name);
            formData.append("shift_start", emp.shift_start);
            formData.append("shift_end", emp.shift_end);
            formData.append("designation", newRole);
            await fetch(`${API_BASE}/employees/${emp.id}`, {
              method: "PUT",
              headers: { "Authorization": `Bearer ${session.token}` },
              body: formData
            });
            editingIndex = null;
            openRoles.add(newRole);
            loadStaff();
          });

          card.querySelector('.cancelRoleBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            editingIndex = null;
            renderBoard();
          });
        } else {
          card.querySelector('.editBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            editingIndex = index;
            renderBoard();
          });
          card.querySelector('.removeBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            pendingDeleteIndex = index;
            document.getElementById('deleteConfirmText').textContent =
              `Are you sure you want to remove ${staffData[index].name}? This cannot be undone.`;
            document.getElementById('deleteConfirmModal').classList.add('open');
          });
        }

        return card;
      }

      function renderBoard() {
        roleBoard.innerHTML = '';
        const designations = getDesignations();
        roleOptions.innerHTML = designations.map(r => `<option value="${r}"></option>`).join('');

        const term = searchTerm.trim().toLowerCase();
        const isSearching = term.length > 0;

        const matchedIndices = new Set(
          staffData
            .map((s, i) => ({ s, i }))
            .filter(({ s }) => !term || s.name.toLowerCase().includes(term))
            .map(({ i }) => i)
        );

        if (isSearching && matchedIndices.size === 0) {
          const noResults = document.createElement('div');
          noResults.className = 'search-no-results';
          noResults.textContent = `No employees found matching "${searchTerm.trim()}".`;
          roleBoard.appendChild(noResults);
          return;
        }

        designations.forEach((role) => {
          const allMembersInRole = staffData
            .map((s, i) => ({ s, i }))
            .filter(({ s }) => s.role === role);

          const membersWithIndex = isSearching
            ? allMembersInRole.filter(({ i }) => matchedIndices.has(i))
            : allMembersInRole;

          if (isSearching && membersWithIndex.length === 0) return;

          const hasEditingMember = membersWithIndex.some(({ i }) => i === editingIndex);
          if (hasEditingMember) openRoles.add(role);

          const isOpen = isSearching ? true : openRoles.has(role);

          const section = document.createElement('div');
          section.className = 'role-col' + (isOpen ? ' open' : '');

          section.innerHTML = `
        <div class="role-col-head">
          <div class="role-col-head-left">
            <h3>${role}</h3>
            <span class="role-col-count">${membersWithIndex.length}</span>
          </div>
          <svg class="role-col-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
        <div class="role-col-collapse">
          <div class="role-col-body"></div>
        </div>
      `;

          const body = section.querySelector('.role-col-body');
          if (membersWithIndex.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'role-col-empty';
            empty.textContent = 'No employees';
            body.appendChild(empty);
          } else {
            membersWithIndex.forEach(({ s, i }) => body.appendChild(makeStaffCard(s, i)));
          }

          section.querySelector('.role-col-head').addEventListener('click', () => {
            if (isSearching) return;
            if (openRoles.has(role)) openRoles.delete(role);
            else openRoles.add(role);
            renderBoard();
          });

          roleBoard.appendChild(section);
        });
      }

      searchInput.addEventListener('input', () => {
        searchTerm = searchInput.value;
        searchBar.classList.toggle('has-value', searchTerm.length > 0);
        renderBoard();
      });

      searchClear.addEventListener('click', () => {
        searchTerm = '';
        searchInput.value = '';
        searchBar.classList.remove('has-value');
        searchInput.focus();
        renderBoard();
      });

      const addPanel = document.getElementById('addPanel');
      document.getElementById('addToggle').addEventListener('click', () => {
        addPanel.style.display = addPanel.style.display === 'none' ? 'block' : 'none';
      });
      document.getElementById('cancelAdd').addEventListener('click', () => {
        addPanel.style.display = 'none';
      });
      document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formEl = e.target;
        const role = document.getElementById('newRoleInput').value.trim();
        const formData = new FormData();
        formData.append("name", formEl.querySelector('input[type=text]').value);
        formData.append("designation", role);
        formData.append("shift_start", formEl.querySelector('input[type=time]').value);
        formData.append("shift_end", formEl.querySelectorAll('input[type=time]')[1].value);
        const photoFile = formEl.querySelector('input[type=file]').files[0];
        if (photoFile) formData.append("photos", photoFile);

        await fetch(`${API_BASE}/employees`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${session.token}` },
          body: formData
        });
        openRoles.add(role);
        addPanel.style.display = 'none';
        formEl.reset();
        loadStaff();
      });

      loadStaff();
    }
  </script>
</body>

</html>
