<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Records — VaultWatch</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="shell">
    <nav class="rail">
      <div class="rail-brand stamp" data-stamp></div>

      <a class="rail-link" data-page="dashboard" href="#" data-dash-link>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1" />
        </svg>
        <span class="tip">Dashboard</span>
      </a>
      <a class="rail-link" data-page="employees" href="admin-employees.html" data-admin-only>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="8" r="3" />
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
          <circle cx="17" cy="8" r="2.4" />
          <path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8" />
        </svg>
        <span class="tip">Employees</span>
      </a>
      <a class="rail-link" data-page="cameras" href="cameras-alerts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="7" width="14" height="11" rx="2" />
          <path d="M16.5 10.5 21 8v9l-4.5-2.5" />
        </svg>
        <span class="tip">Cameras & Alerts</span>
      </a>
      <a class="rail-link" data-page="attendance" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2" />
          <path d="M3.5 9.5h17" />
          <path d="M8 3v3M16 3v3" />
          <path d="m8.5 14 2 2 4-4" />
        </svg>
        <span class="tip">Attendance</span>
      </a>
      <a class="rail-link active" data-page="records" href="records.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M8 8h8M8 12h8M8 16h5" />
        </svg>
        <span class="tip">Records</span>
      </a>
      <div class="rail-spacer"></div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Records</div>
        <div class="topbar-right">
          <span class="topbar-clock mono" data-clock></span>
          <button class="theme-toggle" data-theme-toggle title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <span class="role-badge" data-role-badge></span>
          <div class="user-chip">
            <div class="avatar" data-user-avatar></div>
            <span class="name" data-user-name></span>
          </div>
          <button class="logout-btn" data-logout>Sign out</button>
        </div>
      </header>

      <main class="content dark">
        <div class="page-head">
          <span class="eyebrow">Ledger</span>
          <h1>Access & alert records</h1>
          <p>Every entry, exit and flagged event, in order.</p>
        </div>

        <div class="filter-bar">
          <select id="fCamera">
            <option value="">All cameras</option>
          </select>
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="clear">Clear</option>
            <option value="flag">Flagged</option>
            <option value="review">Needs review</option>
          </select>
          <input type="date" id="fDate" />
          <button class="btn btn-brass" data-admin-only style="margin-left:auto;">Export CSV</button>
        </div>

        <div class="panel">
          <div class="table-wrap">
            <table class="records">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Camera</th>
                  <th>Person</th>
                  <th>Event</th>
                  <th>Status</th>
                  <th data-admin-only></th>
                </tr>
              </thead>
              <tbody id="recordsBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const API_BASE = "http://localhost:8000";
    const session = requireAuth(['admin', 'employee']);
    if (session) {
      document.querySelector('[data-dash-link]').href = dashboardFor(session.role);
      initShell(session, 'records');
      initTheme();
      const headers = { "Authorization": `Bearer ${session.token}` };

      const statusLabel = { high: 'Flagged', medium: 'Review', low: 'Clear' };
      const statusPill = { high: 'flag', medium: 'review', low: 'clear' };

      async function loadRecords() {
        const status = document.getElementById('fStatus').value;
        const date = document.getElementById('fDate').value;
        const params = new URLSearchParams();
        if (status) params.append('status', status);
        if (date) params.append('date', date);

        const res = await fetch(`${API_BASE}/records?${params}`, { headers });
        const records = await res.json();

        const body = document.getElementById('recordsBody');
        body.innerHTML = records.map(r => `
      <tr>
        <td class="mono">${new Date(r.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
        <td>${r.alert_type}</td>
        <td>${r.person_name}</td>
        <td>${r.message}</td>
        <td><span class="pill ${statusPill[r.priority]}">${statusLabel[r.priority]}</span></td>
        <td data-admin-only><button class="btn btn-outline btn-sm">Delete</button></td>
      </tr>`).join('');
        document.querySelectorAll('[data-admin-only]').forEach(el => {
          el.style.display = session.role === 'admin' ? '' : 'none';
        });
      }

      ['fCamera', 'fStatus', 'fDate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', loadRecords);
      });

      loadRecords();
    }
  </script>
</body>

</html>
