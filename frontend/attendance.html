<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-page: #020617;
    --bg-panel: #0f172a;
    --text-primary: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #1e293b;
    --accent: #f59e0b;
    --accent-hover: #fbbf24;
    --accent-contrast: #020617;
  }
  html.light {
    --bg-page: #faf3e6;
    --bg-panel: #fffdf8;
    --text-primary: #2d1b0e;
    --text-muted: #8a6d4d;
    --border-color: #e8d5b5;
    --accent: #b8860b;
    --accent-hover: #966f09;
    --accent-contrast: #fffaf0;
  }
  html.light .bg-\[var\(--bg-panel\)\] {
    box-shadow: 0 2px 6px rgba(120, 90, 40, 0.12);
  }
  body { background-color: var(--bg-page); color: var(--text-primary); }
</style>
</head>
<body class="min-h-screen text-sm p-4">
  <div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-3">
      <h1 class="text-lg font-bold">💎 Attendance</h1>
      <div class="flex gap-4 items-center text-sm">
        <a href="dashboard.html" class="text-[var(--accent)] hover:text-[var(--accent-hover)] hover:underline">Camera →</a>
        <a href="admin.html" class="text-[var(--accent)] hover:text-[var(--accent-hover)] hover:underline">Employees →</a>
        <button onclick="toggleTheme()" id="themeToggleBtn" class="border border-[var(--border-color)] rounded-lg px-3 py-1 text-xs">🌙 Dark</button>
      </div>
    </div>

    <div class="flex items-center gap-3 mb-4">
      <label class="text-sm text-[var(--text-muted)]">Date</label>
      <input type="date" id="dateInput" class="bg-[var(--bg-panel)] border border-[var(--border-color)] rounded-lg px-3 py-1.5 text-sm">
    </div>

    <div class="bg-[var(--bg-panel)] rounded-xl border border-[var(--border-color)] overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs uppercase tracking-wide text-[var(--text-muted)] border-b border-[var(--border-color)]">
            <th class="px-4 py-3">Employee</th>
            <th class="px-4 py-3">First Seen</th>
            <th class="px-4 py-3">Last Seen</th>
          </tr>
        </thead>
        <tbody id="attendanceRows"></tbody>
      </table>
      <div id="emptyState" class="hidden text-center text-[var(--text-muted)] py-8">No attendance records for this date</div>
    </div>
  </div>

<script>
//const API = "https://cctv-alerts-mkkx.onrender.com";
const API = "http://localhost:8000";
const API_KEY = "cctv-alerts-pwd-123";
const authHeaders = { "X-API-Key": API_KEY };

function applyTheme(theme) {
  document.documentElement.classList.toggle('light', theme === 'light');
  localStorage.setItem('theme', theme);
  document.getElementById('themeToggleBtn').textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
}
applyTheme(localStorage.getItem('theme') || 'dark');

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function loadAttendance() {
  const date = document.getElementById("dateInput").value;
  const res = await fetch(`${API}/attendance?date=${date}`, { headers: authHeaders });
  const data = await res.json();

  const rows = document.getElementById("attendanceRows");
  const emptyState = document.getElementById("emptyState");

  if (data.records.length === 0) {
    rows.innerHTML = "";
    emptyState.classList.remove("hidden");
    return;
  }

  emptyState.classList.add("hidden");
  rows.innerHTML = data.records.map(r => `
    <tr class="border-b border-[var(--border-color)] last:border-0">
      <td class="px-4 py-3 font-medium">${r.name}</td>
      <td class="px-4 py-3 text-[var(--text-muted)]">${formatTime(r.first_seen)}</td>
      <td class="px-4 py-3 text-[var(--text-muted)]">${formatTime(r.last_seen)}</td>
    </tr>
  `).join("");
}

document.getElementById("dateInput").valueAsDate = new Date();
document.getElementById("dateInput").addEventListener("change", loadAttendance);
loadAttendance();
</script>
</body>
</html>
