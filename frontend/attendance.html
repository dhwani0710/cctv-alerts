<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — VaultWatch</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="shell">
    <nav class="rail">
      <div class="rail-brand stamp" data-stamp></div>

      <a class="rail-link" data-page="dashboard" href="#" data-dash-link>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1" />
        </svg>
        <span class="tip">Dashboard</span>
      </a>
      <a class="rail-link" data-page="employees" href="admin-employees.html" data-admin-only>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="8" r="3" />
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
          <circle cx="17" cy="8" r="2.4" />
          <path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8" />
        </svg>
        <span class="tip">Employees</span>
      </a>
      <a class="rail-link" data-page="cameras" href="cameras-alerts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="7" width="14" height="11" rx="2" />
          <path d="M16.5 10.5 21 8v9l-4.5-2.5" />
        </svg>
        <span class="tip">Cameras & Alerts</span>
      </a>
      <a class="rail-link active" data-page="attendance" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2" />
          <path d="M3.5 9.5h17" />
          <path d="M8 3v3M16 3v3" />
          <path d="m8.5 14 2 2 4-4" />
        </svg>
        <span class="tip">Attendance</span>
      </a>
      <a class="rail-link" data-page="records" href="records.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M8 8h8M8 12h8M8 16h5" />
        </svg>
        <span class="tip">Records</span>
      </a>
      <div class="rail-spacer"></div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Attendance</div>
        <div class="topbar-right">
          <span class="topbar-clock mono" data-clock></span>
          <button class="theme-toggle" data-theme-toggle title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <span class="role-badge" data-role-badge></span>
          <div class="user-chip">
            <div class="avatar" data-user-avatar></div>
            <span class="name" data-user-name></span>
          </div>
          <button class="logout-btn" data-logout>Sign out</button>
        </div>
      </header>

      <main class="content dark">
        <div class="page-head">
          <span class="eyebrow" data-eyebrow>Attendance</span>
          <h1 data-heading>Attendance</h1>
          <p data-sub>Clock-ins, clock-outs and daily status.</p>
        </div>

        <!-- Punch clock — everyone punches their own, admin included -->
        <div class="panel punch-panel" id="punchPanel">
          <div class="panel-head">
            <h2>Punch clock</h2>
            <span class="eyebrow mono" id="punchDate"></span>
          </div>
          <div class="punch-row">
            <div class="punch-field">
              <span class="eyebrow">Status</span>
              <div id="punchStatusText" class="punch-status">Not clocked in</div>
            </div>
            <div class="punch-field">
              <span class="eyebrow">Clock in</span>
              <div id="punchInText" class="mono punch-value">—</div>
            </div>
            <div class="punch-field">
              <span class="eyebrow">Clock out</span>
              <div id="punchOutText" class="mono punch-value">—</div>
            </div>
            <button class="btn btn-brass punch-btn" id="punchBtn">Punch in</button>
          </div>
        </div>

        <div class="stat-grid" id="statGrid"></div>

        <div class="filter-bar">
          <select id="fEmployee" data-admin-only>
            <option value="">All employees</option>
          </select>
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="present">Present</option>
            <option value="late">Late</option>
            <option value="absent">Absent</option>
          </select>
          <input type="date" id="fDate" />
        </div>

        <div class="panel">
          <div class="table-wrap">
            <table class="records">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Employee</th>
                  <th>Clock in</th>
                  <th>Clock out</th>
                  <th>Hours</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const API_BASE = "http://localhost:8000";
    const session = requireAuth(['admin', 'employee']);
    if (session) {
      document.querySelector('[data-dash-link]').href = dashboardFor(session.role);
      initShell(session, 'attendance');
      initTheme();
      const headers = { "Authorization": `Bearer ${session.token}` };

      if (session.role !== 'admin') {
        document.querySelector('[data-eyebrow]').textContent = 'Your record';
        document.querySelector('[data-heading]').textContent = 'My attendance';
        document.querySelector('[data-sub]').textContent = 'Your clock-ins and clock-outs.';
        document.getElementById('fEmployee').style.display = 'none';
      }

      async function loadAttendance() {
        const date = document.getElementById('fDate').value || new Date().toISOString().split('T')[0];
        const res = await fetch(`${API_BASE}/attendance?date=${date}`, { headers });
        const data = await res.json();
        let records = data.records;
        if (session.role !== 'admin') records = records.filter(r => r.name === session.name);

        document.getElementById('attendanceBody').innerHTML = records.map(r => `
      <tr>
        <td class="mono">${data.date}</td>
        <td>${r.name}</td>
        <td class="mono">${new Date(r.first_seen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
        <td class="mono">${new Date(r.last_seen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
        <td class="mono">—</td>
        <td><span class="pill clear">Present</span></td>
      </tr>`).join('') || '<tr><td colspan="6">No records</td></tr>';

        document.getElementById('statGrid').innerHTML = `
      <div class="stat-card good"><span class="eyebrow">Present</span><div class="value">${records.length}</div></div>`;
      }

      document.getElementById('fDate').addEventListener('change', loadAttendance);
      loadAttendance();
    }
  </script>
</body>

</html>
