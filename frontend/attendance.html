<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance — VaultWatch</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="shell">
  <nav class="rail">
    <div class="rail-brand stamp" data-stamp></div>

    <a class="rail-link" data-page="dashboard" href="#" data-dash-link>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/></svg>
      <span class="tip">Dashboard</span>
    </a>
    <a class="rail-link" data-page="employees" href="admin-employees.html" data-admin-only>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8"/></svg>
      <span class="tip">Employees</span>
    </a>
    <a class="rail-link" data-page="cameras" href="cameras-alerts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="7" width="14" height="11" rx="2"/><path d="M16.5 10.5 21 8v9l-4.5-2.5"/></svg>
      <span class="tip">Cameras & Alerts</span>
    </a>
    <a class="rail-link active" data-page="attendance" href="attendance.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v3M16 3v3"/><path d="m8.5 14 2 2 4-4"/></svg>
      <span class="tip">Attendance</span>
    </a>
    <a class="rail-link" data-page="records" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="tip">Records</span>
    </a>
    <div class="rail-spacer"></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Attendance</div>
      <div class="topbar-right">
        <span class="topbar-clock mono" data-clock></span>
        <button class="theme-toggle" data-theme-toggle title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="role-badge" data-role-badge></span>
        <div class="user-chip">
          <div class="avatar" data-user-avatar></div>
          <span class="name" data-user-name></span>
        </div>
        <button class="logout-btn" data-logout>Sign out</button>
      </div>
    </header>

    <main class="content dark">
      <div class="page-head">
        <span class="eyebrow" data-eyebrow>Attendance</span>
        <h1 data-heading>Attendance</h1>
        <p data-sub>Clock-ins, clock-outs and daily status.</p>
      </div>

      <!-- Punch clock — everyone punches their own, admin included -->
      <div class="panel punch-panel" id="punchPanel">
        <div class="panel-head">
          <h2>Punch clock</h2>
          <span class="eyebrow mono" id="punchDate"></span>
        </div>
        <div class="punch-row">
          <div class="punch-field">
            <span class="eyebrow">Status</span>
            <div id="punchStatusText" class="punch-status">Not clocked in</div>
          </div>
          <div class="punch-field">
            <span class="eyebrow">Clock in</span>
            <div id="punchInText" class="mono punch-value">—</div>
          </div>
          <div class="punch-field">
            <span class="eyebrow">Clock out</span>
            <div id="punchOutText" class="mono punch-value">—</div>
          </div>
          <button class="btn btn-brass punch-btn" id="punchBtn">Punch in</button>
        </div>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="filter-bar">
        <select id="fEmployee" data-admin-only>
          <option value="">All employees</option>
        </select>
        <select id="fStatus">
          <option value="">All statuses</option>
          <option value="present">Present</option>
          <option value="late">Late</option>
          <option value="absent">Absent</option>
        </select>
        <input type="date" id="fDate" />
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="records">
            <thead>
              <tr>
                <th>Date</th>
                <th>Employee</th>
                <th>Clock in</th>
                <th>Clock out</th>
                <th>Hours</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="attendanceBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const session = requireAuth(['admin', 'employee']);
  if (session) {
    document.querySelector('[data-dash-link]').href = dashboardFor(session.role);
    initShell(session, 'attendance');
    initTheme();

    const isAdmin = session.role === 'admin';

    // Cache every element this page touches once, up front — avoids
    // repeated getElementById/querySelector lookups on every render.
    const els = {
      eyebrow: document.querySelector('[data-eyebrow]'),
      heading: document.querySelector('[data-heading]'),
      sub: document.querySelector('[data-sub]'),
      empSelect: document.getElementById('fEmployee'),
      statusSelect: document.getElementById('fStatus'),
      dateInput: document.getElementById('fDate'),
      statGrid: document.getElementById('statGrid'),
      tableBody: document.getElementById('attendanceBody'),
      punchDate: document.getElementById('punchDate'),
      punchStatusText: document.getElementById('punchStatusText'),
      punchInText: document.getElementById('punchInText'),
      punchOutText: document.getElementById('punchOutText'),
      punchBtn: document.getElementById('punchBtn'),
    };

    // Note: initShell() already hides every [data-admin-only] element
    // for non-admins (including #fEmployee), so this page doesn't need
    // to toggle that itself.

    if (isAdmin) {
      const frag = document.createDocumentFragment();
      MOCK_STAFF.forEach((s) => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        frag.appendChild(opt);
      });
      els.empSelect.appendChild(frag);
    } else {
      els.eyebrow.textContent = 'Your record';
      els.heading.textContent = 'My Attendance';
      els.sub.textContent = 'Your clock-ins, clock-outs and daily status.';
    }

    // ---- date/time helpers — demo only, uses the browser's clock ----
    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function nowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function diffHours(inStr, outStr) {
      const [ih, im] = inStr.split(':').map(Number);
      const [oh, om] = outStr.split(':').map(Number);
      let mins = (oh * 60 + om) - (ih * 60 + im);
      if (mins < 0) mins += 24 * 60;
      return `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}m`;
    }
    const LATE_AFTER = '09:30';

    function getBaseRecords() {
      return isAdmin ? MOCK_ATTENDANCE : MOCK_ATTENDANCE.filter((r) => r.name === session.name);
    }
    function getTodayRecordForSelf() {
      const today = todayStr();
      return MOCK_ATTENDANCE.find((r) => r.name === session.name && r.date === today);
    }

    // ---- punch clock ----
    els.punchDate.textContent = todayStr();

    function punchIn() {
      const time = nowTime();
      const status = time > LATE_AFTER ? 'late' : 'present';
      let rec = getTodayRecordForSelf();
      if (rec) {
        rec.clockIn = time;
        rec.status = status;
      } else {
        rec = { name: session.name, date: todayStr(), clockIn: time, clockOut: '—', hours: '—', status };
        MOCK_ATTENDANCE.unshift(rec);
      }
      refreshAll();
    }

    function punchOut() {
      const rec = getTodayRecordForSelf();
      if (!rec || rec.clockIn === '—') return;
      rec.clockOut = nowTime();
      rec.hours = diffHours(rec.clockIn, rec.clockOut);
      refreshAll();
    }

    function updatePunchUI() {
      const rec = getTodayRecordForSelf();
      const btn = els.punchBtn;
      els.punchInText.textContent = rec ? rec.clockIn : '—';
      els.punchOutText.textContent = rec ? rec.clockOut : '—';

      if (!rec || rec.clockIn === '—') {
        els.punchStatusText.textContent = 'Not clocked in';
        btn.textContent = 'Punch in';
        btn.disabled = false;
        btn.className = 'btn btn-brass punch-btn';
      } else if (rec.clockOut === '—') {
        els.punchStatusText.textContent = rec.status === 'late' ? 'Clocked in — late' : 'Clocked in';
        btn.textContent = 'Punch out';
        btn.disabled = false;
        btn.className = 'btn btn-danger punch-btn';
      } else {
        els.punchStatusText.textContent = 'Shift complete';
        btn.textContent = 'Done for today';
        btn.disabled = true;
        btn.className = 'btn btn-outline punch-btn';
      }
    }

    els.punchBtn.addEventListener('click', () => {
      const rec = getTodayRecordForSelf();
      if (!rec || rec.clockIn === '—') punchIn();
      else if (rec.clockOut === '—') punchOut();
    });

    // ---- table ----
    const statusLabel = { present: 'Present', late: 'Late', absent: 'Absent' };
    const statusPill  = { present: 'clear',   late: 'review', absent: 'flag' };

    function renderTable(list) {
      const frag = document.createDocumentFragment();
      list.forEach((r) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono">${r.date}</td>
          <td>${r.name}</td>
          <td class="mono">${r.clockIn}</td>
          <td class="mono">${r.clockOut}</td>
          <td class="mono">${r.hours}</td>
          <td><span class="pill ${statusPill[r.status]}">${statusLabel[r.status]}</span></td>`;
        frag.appendChild(tr);
      });
      els.tableBody.innerHTML = '';
      els.tableBody.appendChild(frag);
    }

    function applyFilters(base) {
      const emp = isAdmin ? els.empSelect.value : '';
      const status = els.statusSelect.value;
      const date = els.dateInput.value;
      renderTable(
        base.filter(
          (r) =>
            (!emp || r.name === emp) &&
            (!status || r.status === status) &&
            (!date || r.date === date)
        )
      );
    }

    // ---- stat cards — single pass over the records instead of
    // filtering the same array four separate times ----
    function renderStats(base) {
      const today = todayStr();
      let presentCount = 0, lateCount = 0, absentCount = 0, presentToday = 0, absentToday = 0;

      base.forEach((r) => {
        if (r.status === 'present') presentCount++;
        else if (r.status === 'late') lateCount++;
        else if (r.status === 'absent') absentCount++;

        if (r.date === today) {
          if (r.status === 'present') presentToday++;
          else if (r.status === 'absent') absentToday++;
        }
      });

      els.statGrid.innerHTML = isAdmin ? `
        <div class="stat-card good">
          <span class="eyebrow">Present today</span>
          <div class="value">${presentToday} / ${MOCK_STAFF.length}</div>
          <div class="delta">as of ${today}</div>
        </div>
        <div class="stat-card warn">
          <span class="eyebrow">Absent today</span>
          <div class="value">${absentToday}</div>
          <div class="delta">across all staff</div>
        </div>
        <div class="stat-card">
          <span class="eyebrow">Late (all time)</span>
          <div class="value">${lateCount}</div>
          <div class="delta">flagged late arrivals</div>
        </div>
        <div class="stat-card">
          <span class="eyebrow">Staff tracked</span>
          <div class="value">${MOCK_STAFF.length}</div>
          <div class="delta">on the roster</div>
        </div>` : `
        <div class="stat-card good">
          <span class="eyebrow">Days present</span>
          <div class="value">${presentCount}</div>
          <div class="delta">in your record</div>
        </div>
        <div class="stat-card warn">
          <span class="eyebrow">Days late</span>
          <div class="value">${lateCount}</div>
          <div class="delta">in your record</div>
        </div>
        <div class="stat-card">
          <span class="eyebrow">Days absent</span>
          <div class="value">${absentCount}</div>
          <div class="delta">in your record</div>
        </div>`;
    }

    // Full refresh: recomputes base records once and reuses it for
    // both the table and the stat cards, then syncs the punch panel.
    function refreshAll() {
      const base = getBaseRecords();
      applyFilters(base);
      renderStats(base);
      updatePunchUI();
    }

    // Filter-only changes don't touch stats or the punch panel, so
    // they skip straight to re-filtering the table.
    function onFilterChange() {
      applyFilters(getBaseRecords());
    }
    els.statusSelect.addEventListener('change', onFilterChange);
    els.dateInput.addEventListener('change', onFilterChange);
    if (isAdmin) els.empSelect.addEventListener('change', onFilterChange);

    refreshAll();
  }
</script>
</body>
</html>
