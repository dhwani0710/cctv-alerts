<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Store Admin - Employee Setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-page: #020617;
    --bg-panel: #0f172a;
    --text-primary: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #1e293b;
    --input-bg: #1e293b;
    --accent: #f59e0b;
    --accent-hover: #fbbf24;
    --accent-contrast: #020617;
  }
  html.light {
    --bg-page: #faf3e6;
    --bg-panel: #fffdf8;
    --text-primary: #2d1b0e;
    --text-muted: #8a6d4d;
    --border-color: #e8d5b5;
    --input-bg: #f6ead2;
    --accent: #b8860b;
    --accent-hover: #966f09;
    --accent-contrast: #fffaf0;
  }
  html.light .bg-\[var\(--bg-panel\)\] {
    box-shadow: 0 2px 6px rgba(120, 90, 40, 0.12);
  }
  body { background-color: var(--bg-page); color: var(--text-primary); }
</style>
</head>
<body class="min-h-screen text-sm p-4">
  <div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-1">
      <h1 class="text-lg font-bold">💎 Jewellery Store — Employee Setup</h1>
      <div class="flex gap-4 text-sm items-center">
        <a href="dashboard.html" class="text-[var(--accent)] hover:text-[var(--accent-hover)] hover:underline">View Camera →</a>
        <button onclick="document.getElementById('settingsModal').classList.remove('hidden')" class="text-[var(--text-muted)] hover:text-[var(--text-primary)]">⚙ Store Hours</button>
        <button onclick="toggleTheme()" id="themeToggleBtn" class="border border-[var(--border-color)] rounded-lg px-3 py-1 text-xs">🌙 Dark</button>
      </div>
    </div>
    <p class="text-[var(--text-muted)] mb-6 text-sm">Add staff so the system can recognize them and flag anyone unknown.</p>

    <form id="employeeForm" class="bg-[var(--bg-panel)] rounded-xl p-4 shadow-lg space-y-3 border border-[var(--border-color)]">
      <div>
        <label class="block text-sm text-[var(--text-muted)] mb-1">Employee Name</label>
        <input type="text" id="name" required class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-[var(--text-muted)] mb-1">Shift Start</label>
          <input type="time" id="shift_start" required class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
        <div>
          <label class="block text-sm text-[var(--text-muted)] mb-1">Shift End</label>
          <input type="time" id="shift_end" required class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-sm text-[var(--text-muted)] mb-1">Photo (clear face photo)</label>
        <input type="file" id="photo" accept="image/*" required class="w-full text-sm text-[var(--text-muted)]">
      </div>
      <button type="submit" class="bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-[var(--accent-contrast)] font-semibold px-6 py-2 rounded-lg transition text-sm">Add Employee</button>
    </form>

    <h2 class="text-xs uppercase tracking-wide text-[var(--text-muted)] font-semibold mt-6 mb-3">Current Employees</h2>
    <div id="employeeList" class="space-y-2 max-h-80 overflow-y-auto"></div>
  </div>

  <div id="confirmModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
    <div class="bg-[var(--bg-panel)] border border-[var(--border-color)] rounded-xl p-6 w-96 space-y-4">
      <h2 class="text-lg font-semibold">Remove Employee</h2>
      <p class="text-[var(--text-muted)] text-sm">Are you sure you want to remove <span id="confirmName" class="text-[var(--text-primary)] font-medium"></span>? This cannot be undone.</p>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeConfirmModal()" class="text-[var(--text-muted)] text-sm px-4 py-2">Cancel</button>
        <button onclick="confirmDelete()" class="bg-red-500 hover:bg-red-400 text-white font-semibold px-4 py-2 rounded-lg text-sm">Remove</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
    <div class="bg-[var(--bg-panel)] border border-[var(--border-color)] rounded-xl p-6 w-96 space-y-4">
      <h2 class="text-lg font-semibold">Edit Employee</h2>
      <div>
        <label class="block text-sm text-[var(--text-muted)] mb-1">Employee Name</label>
        <input type="text" id="editName" required class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-[var(--text-muted)] mb-1">Shift Start</label>
          <input type="time" id="editShiftStart" required class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
        <div>
          <label class="block text-sm text-[var(--text-muted)] mb-1">Shift End</label>
          <input type="time" id="editShiftEnd" required class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-sm text-[var(--text-muted)] mb-1">New Photo (optional — leave blank to keep current)</label>
        <input type="file" id="editPhoto" accept="image/*" class="w-full text-sm text-[var(--text-muted)]">
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeEditModal()" class="text-[var(--text-muted)] text-sm px-4 py-2">Cancel</button>
        <button onclick="submitEdit()" class="bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-[var(--accent-contrast)] font-semibold px-4 py-2 rounded-lg text-sm">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
    <div class="bg-[var(--bg-panel)] border border-[var(--border-color)] rounded-xl p-6 w-96 space-y-4">
      <h2 class="text-lg font-semibold">Store Hours</h2>
      <div>
        <label class="block text-sm text-[var(--text-muted)] mb-1">Opening Time</label>
        <input type="time" id="openTime" class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm text-[var(--text-muted)] mb-1">Closing Time</label>
        <input type="time" id="closeTime" class="w-full bg-[var(--input-bg)] rounded-lg px-4 py-2 text-sm">
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="text-[var(--text-muted)] text-sm">Cancel</button>
        <button onclick="saveSettings()" class="bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-[var(--accent-contrast)] font-semibold px-4 py-2 rounded-lg text-sm">Save</button>
      </div>
    </div>
  </div>

<script>
const API = "https://cctv-alerts.onrender.com";
const API_KEY = "cctv-alerts-pwd-123";

const authHeaders = { "X-API-Key": API_KEY };

function applyTheme(theme) {
  document.documentElement.classList.toggle('light', theme === 'light');
  localStorage.setItem('theme', theme);
  document.getElementById('themeToggleBtn').textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
}
applyTheme(localStorage.getItem('theme') || 'dark');

async function loadSettingsIntoUI() {
  const res = await fetch(`${API}/settings`, { headers: authHeaders });
  const s = await res.json();
  document.getElementById("openTime").value = s.store_open_time;
  document.getElementById("closeTime").value = s.store_close_time;
}

async function saveSettings() {
  const formData = new FormData();
  formData.append("store_open_time", document.getElementById("openTime").value);
  formData.append("store_close_time", document.getElementById("closeTime").value);
  await fetch(`${API}/settings`, { method: "POST", headers: authHeaders, body: formData });
  document.getElementById("settingsModal").classList.add("hidden");
  loadSettingsIntoUI();
}

function isOvernightShift(start, end) {
  return end <= start;
}

async function loadEmployees() {
  const res = await fetch(`${API}/employees`, { headers: authHeaders });
  const employees = await res.json();
  const list = document.getElementById("employeeList");
  list.innerHTML = employees.map(e => `
    <div class="flex justify-between items-center bg-[var(--bg-panel)] border border-[var(--border-color)] rounded-lg px-4 py-3">
      <div>
        <span class="font-medium">${e.name}</span>
        <span class="text-[var(--text-muted)] text-sm ml-2">${e.shift_start} – ${e.shift_end}</span>
        ${isOvernightShift(e.shift_start, e.shift_end) ? '<span class="text-amber-500 text-xs ml-2 border border-amber-500/40 rounded px-1.5 py-0.5">overnight</span>' : ''}
      </div>
      <div class="flex gap-4 w-32 justify-end shrink-0">
        <button onclick="openEditModal(${e.id}, '${e.name}', '${e.shift_start}', '${e.shift_end}')" class="text-[var(--accent)] hover:text-[var(--accent-hover)] text-sm">Edit</button>
        <button onclick="deleteEmployee(${e.id}, '${e.name}')" class="text-red-500 hover:text-red-400 text-sm">Remove</button>
      </div>
    </div>
  `).join("");
}

let pendingDeleteId = null;

function deleteEmployee(id, name) {
  pendingDeleteId = id;
  document.getElementById("confirmName").innerText = name;
  document.getElementById("confirmModal").classList.remove("hidden");
}

function closeConfirmModal() {
  pendingDeleteId = null;
  document.getElementById("confirmModal").classList.add("hidden");
}

async function confirmDelete() {
  if (pendingDeleteId === null) return;
  await fetch(`${API}/employees/${pendingDeleteId}`, { method: "DELETE", headers: authHeaders });
  closeConfirmModal();
  loadEmployees();
}

let pendingEditId = null;

function openEditModal(id, name, shiftStart, shiftEnd) {
  pendingEditId = id;
  document.getElementById("editName").value = name;
  document.getElementById("editShiftStart").value = shiftStart;
  document.getElementById("editShiftEnd").value = shiftEnd;
  document.getElementById("editPhoto").value = "";
  document.getElementById("editModal").classList.remove("hidden");
}

function closeEditModal() {
  pendingEditId = null;
  document.getElementById("editModal").classList.add("hidden");
}

async function submitEdit() {
  if (pendingEditId === null) return;

  const formData = new FormData();
  formData.append("name", document.getElementById("editName").value);
  formData.append("shift_start", document.getElementById("editShiftStart").value);
  formData.append("shift_end", document.getElementById("editShiftEnd").value);

  const photoFile = document.getElementById("editPhoto").files[0];
  if (photoFile) {
    formData.append("photo", photoFile);
  }

  const res = await fetch(`${API}/employees/${pendingEditId}`, { method: "PUT", headers: authHeaders, body: formData });
  const result = await res.json();
  if (res.ok && !result.error) {
    closeEditModal();
    loadEmployees();
  } else {
    alert(result.error || "Failed to update employee");
  }
}

document.getElementById("employeeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formData = new FormData();
  formData.append("name", document.getElementById("name").value);
  formData.append("shift_start", document.getElementById("shift_start").value);
  formData.append("shift_end", document.getElementById("shift_end").value);
  formData.append("photo", document.getElementById("photo").files[0]);

  const res = await fetch(`${API}/employees`, { method: "POST", headers: authHeaders, body: formData });
  const result = await res.json();
  if (res.ok && !result.error) {
    e.target.reset();
    loadEmployees();
  } else {
    alert(result.error || "Failed to add employee");
  }
});

loadSettingsIntoUI();
loadEmployees();
</script>
</body>
</html>
