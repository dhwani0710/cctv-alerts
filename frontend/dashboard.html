<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Store Security Dashboard</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-page: #020617;
    --bg-panel: #0f172a;
    --text-primary: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #1e293b;
    --accent: #f59e0b;
    --accent-hover: #fbbf24;
    --accent-contrast: #020617;
  }
  html.light {
    --bg-page: #faf3e6;
    --bg-panel: #fffdf8;
    --text-primary: #2d1b0e;
    --text-muted: #8a6d4d;
    --border-color: #e8d5b5;
    --accent: #b8860b;
    --accent-hover: #966f09;
    --accent-contrast: #fffaf0;
  }
  html.light .bg-\[var\(--bg-panel\)\] {
    box-shadow: 0 2px 6px rgba(120, 90, 40, 0.12);
  }
  html, body { height: 100%; }
  body { background-color: var(--bg-page); color: var(--text-primary); }
</style>
</head>
<body class="text-sm p-4 overflow-hidden">
  <div class="max-w-6xl mx-auto h-full flex flex-col">
    <div class="flex justify-between items-center mb-3 shrink-0">
      <h1 class="text-lg font-bold">💎 Store Security Dashboard</h1>
      <div class="flex gap-4 items-center text-sm">
        <a href="admin.html" class="text-[var(--accent)] hover:text-[var(--accent-hover)] hover:underline">Manage Employees →</a>
        <button onclick="toggleTheme()" id="themeToggleBtn" class="border border-[var(--border-color)] rounded-lg px-3 py-1 text-xs">🌙 Dark</button>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4 flex-1 min-h-0">
      <div class="col-span-2 relative bg-[var(--bg-panel)] rounded-xl border border-[var(--border-color)] overflow-hidden">
        <img id="videoFeed" class="w-full h-full object-cover" />
        <div id="cameraToast" class="hidden absolute top-3 left-3 right-3 border-l-4 rounded px-3 py-2 shadow-lg backdrop-blur-sm"></div>
      </div>

      <div class="flex flex-col gap-3 min-h-0">
        <div class="bg-[var(--bg-panel)] rounded-xl border border-[var(--border-color)] p-3 shrink-0">
          <h2 class="font-semibold mb-2 text-xs uppercase tracking-wide text-[var(--text-muted)]">Currently Detected</h2>
          <div id="detected" class="space-y-1 text-sm"></div>
        </div>
        <div class="bg-[var(--bg-panel)] rounded-xl border border-[var(--border-color)] p-3 text-sm text-[var(--text-muted)] shrink-0">
          <div id="hoursLabel">Store hours: loading...</div>
        </div>
        <div class="bg-[var(--bg-panel)] rounded-xl border border-[var(--border-color)] p-3 flex-1 min-h-0 flex flex-col">
          <h2 class="font-semibold mb-2 text-xs uppercase tracking-wide text-[var(--text-muted)] shrink-0">Live Alerts</h2>
          <div id="alerts" class="space-y-1 overflow-y-auto text-sm flex-1"></div>
        </div>
      </div>
    </div>
  </div>

<script>
//const API = "https://cctv-alerts.onrender.com";
const API = "http://localhost:8000";
const API_KEY = "cctv-alerts-pwd-123";

const authHeaders = { "X-API-Key": API_KEY };
document.getElementById("videoFeed").src = `${API}/video_feed?api_key=${API_KEY}`;
const priorityColor = { low: "border-yellow-500 bg-yellow-500/10 text-yellow-500",
                         medium: "border-orange-500 bg-orange-500/10 text-orange-500",
                         high: "border-red-500 bg-red-500/10 text-red-500" };
let lastToastedTimestamp = null;
let toastHideTimer = null;

function applyTheme(theme) {
  document.documentElement.classList.toggle('light', theme === 'light');
  localStorage.setItem('theme', theme);
  document.getElementById('themeToggleBtn').textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
}
applyTheme(localStorage.getItem('theme') || 'dark');

function showCameraToast(alert) {
  const toast = document.getElementById("cameraToast");
  toast.className = `absolute top-3 left-3 right-3 border-l-4 rounded px-3 py-2 shadow-lg backdrop-blur-sm ${priorityColor[alert.priority]}`;
  toast.innerHTML = `<span class="font-semibold uppercase text-xs mr-2">${alert.priority}</span>${alert.message}`;
  toast.classList.remove("hidden");

  if (toastHideTimer) clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(() => toast.classList.add("hidden"), 6000);
}

async function loadSettingsIntoUI() {
  const res = await fetch(`${API}/settings`, { headers: authHeaders });
  const s = await res.json();
  document.getElementById("hoursLabel").innerText = `Store hours: ${s.store_open_time} – ${s.store_close_time}`;
}

async function refresh() {
  const res = await fetch(`${API}/status`, { headers: authHeaders });
  const data = await res.json();

  document.getElementById("detected").innerHTML = data.currently_detected.length
    ? data.currently_detected.map(d => `<div class="bg-[var(--bg-page)] border border-[var(--border-color)] rounded-lg px-3 py-2">${d.name}</div>`).join("")
    : `<div class="text-[var(--text-muted)]">No one detected</div>`;

  document.getElementById("alerts").innerHTML = data.recent_alerts.length
    ? data.recent_alerts.map(a => {
        const time = new Date(a.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="border-l-4 ${priorityColor[a.priority]} rounded px-3 py-2 flex justify-between items-center">
            <div>
              <span class="text-xs text-[var(--text-muted)] mr-2">${time}</span>
              <span>${a.message}</span>
            </div>
            <span class="uppercase text-xs font-semibold">${a.priority}</span>
          </div>
        `;
      }).join("")
    : `<div class="text-[var(--text-muted)]">No alerts</div>`;

  if (data.recent_alerts.length > 0) {
    const newest = data.recent_alerts[0];
    if (newest.timestamp !== lastToastedTimestamp) {
      lastToastedTimestamp = newest.timestamp;
      showCameraToast(newest);
    }
  }
}

loadSettingsIntoUI();
setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
