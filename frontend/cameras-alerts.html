<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cameras & Alerts — VaultWatch</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="shell">
  <nav class="rail">
    <div class="rail-brand stamp" data-stamp></div>

    <a class="rail-link" data-page="dashboard" href="#" data-dash-link>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/></svg>
      <span class="tip">Dashboard</span>
    </a>
    <a class="rail-link" data-page="employees" href="admin-employees.html" data-admin-only>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8"/></svg>
      <span class="tip">Employees</span>
    </a>
    <a class="rail-link active" data-page="cameras" href="cameras-alerts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="7" width="14" height="11" rx="2"/><path d="M16.5 10.5 21 8v9l-4.5-2.5"/></svg>
      <span class="tip">Cameras & Alerts</span>
    </a>
    <a class="rail-link" data-page="attendance" href="attendance.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v3M16 3v3"/><path d="m8.5 14 2 2 4-4"/></svg>
      <span class="tip">Attendance</span>
    </a>
    <a class="rail-link" data-page="records" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="tip">Records</span>
    </a>
    <div class="rail-spacer"></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Cameras & Alerts</div>
      <div class="topbar-right">
        <span class="topbar-clock mono" data-clock></span>
        <button class="theme-toggle" data-theme-toggle title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="role-badge" data-role-badge></span>
        <div class="user-chip">
          <div class="avatar" data-user-avatar></div>
          <span class="name" data-user-name></span>
        </div>
        <button class="logout-btn" data-logout>Sign out</button>
      </div>
    </header>

    <main class="content dark">
      <div class="page-head">
        <span class="eyebrow">Live Monitoring</span>
        <h1>Cameras & alerts</h1>
        <p>Six zones, monitored continuously. Feeds shown here are illustrative.</p>
      </div>

      <div class="two-col">
        <div>
          <div class="panel-head" style="margin-bottom:14px;">
            <h2>Camera feeds</h2>
          </div>
          <div class="cam-grid" id="camGrid"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Alerts</h2>
            <span class="eyebrow" id="alertCount"></span>
          </div>
          <div id="alertList"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="cam-lightbox" id="camLightbox">
  <button class="cam-lightbox-close" id="camLightboxClose">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="cam-lightbox-inner" id="camLightboxInner"></div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const session = requireAuth(['admin', 'employee']);
  if (session) {
    document.querySelector('[data-dash-link]').href = dashboardFor(session.role);
    initShell(session, 'cameras');
    initTheme();

    const camGrid = document.getElementById('camGrid');
const lightbox = document.getElementById('camLightbox');
const lightboxInner = document.getElementById('camLightboxInner');

function openLightbox(c) {
  lightboxInner.innerHTML = `
    <div class="cam-feed">
      <div class="noise-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="7" width="14" height="11" rx="2"/><path d="M16.5 10.5 21 8v9l-4.5-2.5"/></svg></div>
      <div class="cam-live ${c.live ? '' : 'offline'}"><span class="rec-dot"></span>${c.live ? 'LIVE' : 'OFFLINE'}</div>
      <div class="cam-time mono">${c.id}</div>
    </div>
    <div class="cam-meta">
      <div>
        <div class="name">${c.name}</div>
        <div class="zone">${c.zone}</div>
      </div>
    </div>`;
  lightbox.classList.add('open');
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxInner.innerHTML = '';
}
document.getElementById('camLightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

MOCK_CAMERAS.forEach((c) => {
  const tile = document.createElement('div');
  tile.className = 'cam-tile';
  tile.innerHTML = `
    <div class="cam-feed">
      <div class="noise-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="7" width="14" height="11" rx="2"/><path d="M16.5 10.5 21 8v9l-4.5-2.5"/></svg></div>
      <div class="cam-live ${c.live ? '' : 'offline'}"><span class="rec-dot"></span>${c.live ? 'LIVE' : 'OFFLINE'}</div>
      <div class="cam-time mono">${c.id}</div>
    </div>
    <div class="cam-meta">
      <div>
        <div class="name">${c.name}</div>
        <div class="zone">${c.zone}</div>
      </div>
      <button class="btn btn-outline btn-sm" data-admin-only>Settings</button>
    </div>`;
  tile.addEventListener('click', () => openLightbox(c));
  const settingsBtn = tile.querySelector('button');
  if (settingsBtn) settingsBtn.addEventListener('click', (e) => e.stopPropagation());
  camGrid.appendChild(tile);
});

    const alertCount = document.getElementById('alertCount');
    alertCount.textContent = MOCK_ALERTS.length + ' today';

    const alertList = document.getElementById('alertList');
    MOCK_ALERTS.forEach((a) => {
      const row = document.createElement('div');
      row.className = 'alert-item';
      row.innerHTML = `
        <div class="alert-sev ${a.sev === 'low' ? 'low' : ''}"></div>
        <div class="alert-body">
          <div class="t">${a.title}</div>
          <div class="d">${a.desc}</div>
          <div class="alert-actions" data-admin-only>
            <button class="btn btn-outline btn-sm">Acknowledge</button>
            <button class="btn btn-danger btn-sm">Dismiss</button>
          </div>
        </div>
        <div class="alert-time mono">${a.time}</div>`;
      alertList.appendChild(row);
    });
  }
</script>
</body>
</html>
