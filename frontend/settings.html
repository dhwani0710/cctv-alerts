<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Settings — VaultWatch</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="rail-brand stamp" data-stamp></div>
    <a class="rail-link" data-page="dashboard" href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/></svg><span class="tip">Dashboard</span></a>
    <a class="rail-link" data-page="employees" href="admin-employees.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8"/></svg><span class="tip">Employees</span></a>
    <a class="rail-link" data-page="cameras" href="cameras-alerts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="7" width="14" height="11" rx="2"/><path d="M16.5 10.5 21 8v9l-4.5-2.5"/></svg><span class="tip">Cameras & Alerts</span></a>
    <a class="rail-link" data-page="attendance" href="attendance.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v3M16 3v3"/><path d="m8.5 14 2 2 4-4"/></svg><span class="tip">Attendance</span></a>
    <a class="rail-link" data-page="records" href="records.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="tip">Records</span></a>
    <a class="rail-link active" data-page="settings" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="tip">Settings</span></a>
    <div class="rail-spacer"></div>
  </nav>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Settings</div>
      <div class="topbar-right">
        <span class="topbar-clock mono" data-clock></span>
        <button class="theme-toggle" data-theme-toggle><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <span class="role-badge" data-role-badge></span>
        <div class="user-chip"><div class="avatar" data-user-avatar></div><span class="name" data-user-name></span></div>
        <button class="logout-btn" data-logout>Sign out</button>
      </div>
    </header>
    <main class="content dark">
      <div class="page-head"><span class="eyebrow">Admin only</span><h1>Store hours</h1><p>Used to decide whether an unrecognized face is a customer or a threat.</p></div>
      <div class="panel" style="max-width:420px;">
        <form id="hoursForm" style="display:grid; gap:14px;">
          <div class="field"><label>Opening time</label><input type="time" id="openTime" required /></div>
          <div class="field"><label>Closing time</label><input type="time" id="closeTime" required /></div>
          <button type="submit" class="btn btn-brass">Save</button>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const API_BASE = "http://localhost:8000";
const session = requireAuth(['admin']);
if (session) {
  initShell(session, 'settings');
  initTheme();
  const headers = { "Authorization": `Bearer ${session.token}` };

  fetch(`${API_BASE}/settings`, { headers }).then(r => r.json()).then(s => {
    document.getElementById('openTime').value = s.store_open_time;
    document.getElementById('closeTime').value = s.store_close_time;
  });

  document.getElementById('hoursForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append("store_open_time", document.getElementById('openTime').value);
    formData.append("store_close_time", document.getElementById('closeTime').value);
    await fetch(`${API_BASE}/settings`, { method: "POST", headers, body: formData });
    alert("Saved");
  });
}
</script>
</body>
</html>
